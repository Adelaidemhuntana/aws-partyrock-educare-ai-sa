AWSTemplateFormatVersion: '2010-09-09'
Description: AWS EduCare Cloud Support Platform working serverless demo

Resources:
  SupportRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: educare-support-requests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: request_id
          AttributeType: S
      KeySchema:
        - AttributeName: request_id
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: educare-support-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: educare-support-lambda-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt SupportRequestsTable.Arn

  SupportRequestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: educare-support-request-handler
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          SUPPORT_TABLE_NAME: !Ref SupportRequestsTable
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime
          from uuid import uuid4
          import boto3

          def build_response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': {
                      'Content-Type': 'application/json',
                      'Access-Control-Allow-Origin': '*',
                      'Access-Control-Allow-Headers': 'Content-Type',
                      'Access-Control-Allow-Methods': 'OPTIONS,POST,GET'
                  },
                  'body': json.dumps(body)
              }

          def create_recommendation(challenge):
              challenge_text = challenge.lower()

              if 'math' in challenge_text or 'numeracy' in challenge_text:
                  return 'Create a 7 day numeracy support plan with daily practice, worked examples and parent check ins.'

              if 'read' in challenge_text or 'literacy' in challenge_text or 'english' in challenge_text or 'afrikaans' in challenge_text:
                  return 'Create a reading support plan with short daily reading, vocabulary practice and weekly progress tracking.'

              if 'exam' in challenge_text or 'test' in challenge_text:
                  return 'Create an exam readiness plan with revision blocks, practice questions and confidence support.'

              return 'Create a learner support plan with study guidance, parent support and teacher follow up.'

          def lambda_handler(event, context):
              if event.get('httpMethod') == 'OPTIONS':
                  return build_response(200, {'message': 'CORS preflight success'})

              try:
                  body = event.get('body') or '{}'

                  if isinstance(body, str):
                      data = json.loads(body)
                  else:
                      data = body

                  learner_name = data.get('learner_name', 'Unknown learner')
                  grade = data.get('grade', 'Unknown grade')
                  challenge = data.get('challenge', 'Learner needs academic support')
                  parent_contact = data.get('parent_contact', 'Not provided')

                  recommendation = create_recommendation(challenge)

                  request_item = {
                      'request_id': str(uuid4()),
                      'learner_name': learner_name,
                      'grade': grade,
                      'challenge': challenge,
                      'parent_contact': parent_contact,
                      'recommendation': recommendation,
                      'created_at': datetime.utcnow().isoformat()
                  }

                  table_name = os.environ.get('SUPPORT_TABLE_NAME')
                  dynamodb = boto3.resource('dynamodb')
                  table = dynamodb.Table(table_name)
                  table.put_item(Item=request_item)

                  return build_response(200, {
                      'status': 'SUCCESS',
                      'message': 'Learner support request processed successfully.',
                      'request': request_item
                  })

              except Exception as error:
                  return build_response(500, {
                      'status': 'ERROR',
                      'message': 'The request could not be processed.',
                      'error': str(error)
                  })

  SupportApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: educare-support-api

  SupportResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SupportApi
      ParentId: !GetAtt SupportApi.RootResourceId
      PathPart: support-request

  SupportPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SupportApi
      ResourceId: !Ref SupportResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
          - FunctionArn: !GetAtt SupportRequestFunction.Arn

  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SupportRequestFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

Outputs:
  DynamoDBTableName:
    Description: DynamoDB table for learner support requests
    Value: !Ref SupportRequestsTable

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref SupportRequestFunction

  ApiName:
    Description: API Gateway name
    Value: !Ref SupportApi